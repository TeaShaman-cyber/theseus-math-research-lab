name: MCP-backed research witness
on:
  pull_request:
  workflow_dispatch:
    inputs:
      provider:
        required: true
        type: choice
        options: [wolfram]
      probe:
        required: true
        type: choice
        options: [graph-hodge, filled-cell]
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --prefix mcp
      - run: ./mcp/node_modules/.bin/mcporter --config mcp/config.ci.json --version
      - run: mkdir -p receipts && ./mcp/node_modules/.bin/mcporter --config mcp/config.ci.json list wolfram --json > receipts/mcp-inventory.json
      - run: python tools/research/mcp_witness.py --provider '${{ inputs.provider || 'wolfram' }}' --probe '${{ inputs.probe || 'graph-hodge' }}' --mcporter ./mcp/node_modules/.bin/mcporter --config mcp/config.ci.json --out 'receipts/mcp-witness.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mcp-witness
          path: receipts/
          if-no-files-found: error
